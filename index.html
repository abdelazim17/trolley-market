<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ترولي ماركت - الإصدار 12</title>
    <!-- مكتبة قراءة الإكسيل -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root { --bg-color: #f9f9f9; --text-color: #333; --card-bg: #fff; --primary: #4caf50; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 0; }
        
        /* الهيدر */
        header { background-color: var(--primary); color: white; padding: 15px; text-align: center; }
        
        /* رفع الملف يدوياً في حالة عدم عمل السيرفر المحلي */
        .file-upload { text-align: center; margin: 20px; padding: 15px; background: #fff3cd; border: 1px solid #ffeeba; border-radius: 8px; color: #856404; }
        
        /* السلايدر الخاص بالأقسام */
        .slider-container { display: flex; overflow-x: auto; gap: 15px; padding: 20px; scroll-behavior: smooth; }
        .slider-container::-webkit-scrollbar { display: none; }
        .slider-item { min-width: 120px; text-align: center; background: var(--card-bg); padding: 10px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .slider-item img { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; }
        .slider-item p { margin: 10px 0 0; font-weight: bold; font-size: 14px; }
        
        /* عروض اليوم (المنتجات) */
        .section-title { padding: 0 20px; margin-top: 20px; border-right: 4px solid var(--primary); }
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; padding: 20px; }
        .product-card { background: var(--card-bg); padding: 10px; border-radius: 10px; text-align: center; position: relative; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .product-card img { width: 100%; height: 120px; object-fit: cover; border-radius: 8px; }
        .discount-badge { position: absolute; top: 10px; right: 10px; background: #ff3b30; color: white; padding: 4px 8px; border-radius: 20px; font-size: 12px; font-weight: bold; z-index: 2; }
        .price-old { text-decoration: line-through; color: #888; font-size: 12px; }
        .price-new { color: var(--primary); font-weight: bold; font-size: 16px; margin-right: 5px; }
        
        /* صفحة حول */
        .about-section { background: transparent; padding: 20px; text-align: center; margin-top: 30px; border-top: 1px solid #ddd; }
        .qr-container { display: flex; justify-content: center; gap: 40px; margin-top: 20px; }
        .qr-box { text-align: center; }
        .qr-box img { width: 120px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .btn-group { display: flex; justify-content: center; gap: 15px; margin-top: 20px; }
        .btn { padding: 10px 20px; border: none; border-radius: 8px; color: white; font-weight: bold; cursor: pointer; }
        .btn-copy { background: #333; }
        .btn-share { background: #25D366; }
    </style>
</head>
<body>

    <header>
        <h1>🛒 ترولي ماركت</h1>
    </header>

    <!-- مكان مخصص لرفع ملف الإكسيل في حال التصفح بدون سيرفر محلي -->
    <div class="file-upload" id="uploadMsg">
        <p>لتحديث البيانات، يرجى اختيار ملف <b>data.xlsx</b> الخاص بك:</p>
        <input type="file" id="excelFile" accept=".xlsx" onchange="handleFileUpload(event)">
    </div>

    <!-- 1. سلايدر الأقسام -->
    <h2 class="section-title">تصفح الأقسام</h2>
    <div class="slider-container" id="categorySlider">
        <p style="padding: 20px;">جاري تحميل الأقسام...</p>
    </div>

    <!-- 2. عروض اليوم -->
    <h2 class="section-title">عروض اليوم 🔥</h2>
    <div class="products-grid" id="todaysOffers">
        <p style="padding: 20px;">جاري تحميل العروض...</p>
    </div>

    <!-- 3. صفحة حول (تواصل ومشاركة) -->
    <div class="about-section">
        <h2>تواصل معنا</h2>
        <p id="contactPhone" style="font-size: 20px; font-weight: bold; color: var(--primary);">جاري التحميل...</p>
        
        <div class="qr-container">
            <div class="qr-box">
                <img src="images/qr_phone.jpg" alt="QR Phone">
                <p>تواصل واتساب</p>
            </div>
            <div class="qr-box">
                <img src="images/qr_site.jpg" alt="QR Site">
                <p>رابط الموقع</p>
            </div>
        </div>

        <div class="btn-group">
            <button class="btn btn-copy" onclick="copyLink()">نسخ الرابط</button>
            <button class="btn btn-share" onclick="shareLink()">مشاركة الموقع</button>
        </div>
    </div>

    <script>
        let siteUrl = "";
        let shareMessage = "";

        // محاولة قراءة الملف تلقائياً
        fetch('data.xlsx')
            .then(res => res.arrayBuffer())
            .then(data => processExcelData(new Uint8Array(data)))
            .catch(err => {
                console.log("يجب تشغيل السيرفر أو اختيار الملف يدوياً", err);
            });

        // قراءة الملف عبر الزر المخصص (للهواتف أو الاستخدام بدون سيرفر)
        function handleFileUpload(event) {
            const file = event.target.files[0];
            const reader = new FileReader();
            reader.onload = function(e) {
                const data = new Uint8Array(e.target.result);
                processExcelData(data);
                document.getElementById('uploadMsg').style.display = 'none';
            };
            reader.readAsArrayBuffer(file);
        }

        // معالجة بيانات الإكسيل
        function processExcelData(data) {
            const workbook = XLSX.read(data, {type: 'array'});
            
            // 1. الأقسام
            const categoriesSheet = workbook.Sheets['الأقسام'];
            const categories = XLSX.utils.sheet_to_json(categoriesSheet);
            renderCategories(categories);

            // 2. المنتجات
            const productsSheet = workbook.Sheets['المنتجات'];
            const products = XLSX.utils.sheet_to_json(productsSheet);
            renderOffers(products);

            // 3. الإعدادات
            const settingsSheet = workbook.Sheets['الإعدادات'];
            const settings = XLSX.utils.sheet_to_json(settingsSheet);
            renderSettings(settings);
        }

        function renderCategories(categories) {
            const slider = document.getElementById('categorySlider');
            slider.innerHTML = '';
            categories.forEach(cat => {
                slider.innerHTML += `
                    <div class="slider-item">
                        <img src="${cat['الصورة']}" alt="${cat['القسم']}">
                        <p>${cat['القسم']}</p>
                    </div>
                `;
            });

            // تحريك السلايدر كل 3 ثواني
            setInterval(() => {
                slider.scrollLeft -= 135; // بالناقص لأن الموقع RTL
                if (Math.abs(slider.scrollLeft) >= (slider.scrollWidth - slider.clientWidth - 10)) {
                    slider.scrollLeft = 0;
                }
            }, 3000);
        }

        function renderOffers(products) {
            const offersContainer = document.getElementById('todaysOffers');
            offersContainer.innerHTML = '';
            
            // فلترة المنتجات اللي فيها "عرض اليوم" = نعم
            const offers = products.filter(p => p['عرض اليوم'] === 'نعم');
            
            offers.forEach(product => {
                let oldPrice = parseFloat(product['السعر القديم']);
                let newPrice = parseFloat(product['السعر الجديد']);
                
                // حساب نسبة الخصم
                let discountHtml = '';
                if (oldPrice > newPrice) {
                    let discountPercent = Math.round(((oldPrice - newPrice) / oldPrice) * 100);
                    discountHtml = `<div class="discount-badge">خصم ${discountPercent}%</div>`;
                }

                offersContainer.innerHTML += `
                    <div class="product-card">
                        ${discountHtml}
                        <img src="${product['الصورة']}" alt="${product['الاسم']}">
                        <h3 style="font-size: 14px; margin: 10px 0;">${product['الاسم']}</h3>
                        <div>
                            <span class="price-old">${oldPrice} ج</span>
                            <span class="price-new">${newPrice} ج</span>
                        </div>
                    </div>
                `;
            });
        }

        function renderSettings(settings) {
            settings.forEach(setting => {
                if(setting['الإعداد'] === 'رقم الهاتف') document.getElementById('contactPhone').innerText = setting['القيمة'];
                if(setting['الإعداد'] === 'رابط الموقع') siteUrl = setting['القيمة'];
                if(setting['الإعداد'] === 'رسالة المشاركة') shareMessage = setting['القيمة'];
            });
        }

        // دوال الأزرار
        function copyLink() {
            navigator.clipboard.writeText(siteUrl || window.location.href);
            alert("تم نسخ الرابط بنجاح!");
        }

        function shareLink() {
            if (navigator.share) {
                navigator.share({
                    title: 'ترولي ماركت',
                    text: shareMessage,
                    url: siteUrl || window.location.href
                });
            } else {
                alert("المشاركة غير مدعومة في متصفحك. تم نسخ الرابط.");
                copyLink();
            }
        }
    </script>
</body>
</html>
