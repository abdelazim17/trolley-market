<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ترولي ماركت | الرئيسية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="navbar">
        <div class="logo">
            <h2>ترولي ماركت</h2>
            <span>TROLLEY MARKET</span>
        </div>
        <div class="nav-links">
            <a href="index.html" class="active">الرئيسية</a>
            <a href="offers.html">عروض اليوم</a>
            <a href="about.html">حول الموقع</a>
        </div>
        <div class="header-controls">
            <button class="cart-btn" onclick="toggleCart()">
                <i class="fas fa-shopping-cart"></i> السلة <span id="cart-count">0</span>
            </button>
        </div>
    </header>

    <!-- سلايدر مستطيل بيلف أوتوماتيك -->
    <section class="slider-container">
        <div class="slides" id="slider">
            <!-- مسارات الصور دي أنت هتحطها جوه ملف images بنفس الاسم -->
            <img src="images/slide1.jpg" alt="سلايدر 1" onerror="this.outerHTML='<div class=\'slide-placeholder\'>صورة السلايدر 1 (ضع slide1.jpg في المجلد)</div>'">
            <img src="images/slide2.jpg" alt="سلايدر 2" onerror="this.outerHTML='<div class=\'slide-placeholder\'>صورة السلايدر 2 (ضع slide2.jpg في المجلد)</div>'">
        </div>
    </section>

    <h2 class="section-title">العروض الحالية المميزة 🔥</h2>
    <main class="products-section">
        <div id="loading" style="text-align:center; padding: 20px;">جاري تحميل المنتجات...</div>
        <div class="products-grid" id="products-grid">
            <!-- المنتجات اللي فيها (السعر بعد الخصم) هتتعرض هنا -->
        </div>
    </main>

    <!-- الشريط الجانبي للسلة (Sidebar) -->
    <div class="cart-sidebar" id="cart-sidebar">
        <div class="cart-header">
            <h3>سلة المشتريات</h3>
            <button class="close-cart" onclick="toggleCart()">&times;</button>
        </div>
        <div class="cart-items" id="cart-items"></div>
        <div class="cart-footer">
            <div class="cart-total">الإجمالي: <span id="total-price">0</span> جنيه</div>
            <a href="#" target="_blank" class="checkout-btn" id="checkout-btn">
                <i class="fab fa-whatsapp"></i> إرسال الطلب
            </a>
            <button class="clear-cart-btn" onclick="clearCart()">إفراغ السلة</button>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        // تفعيل السلايدر في الصفحة الرئيسية
        let currentSlide = 0;
        const slides = document.getElementById('slider');
        setInterval(() => {
            currentSlide = (currentSlide + 1) % 2; // 2 هو عدد الصور
            slides.style.transform = `translateX(${currentSlide * 100}%)`; // موجب عشان RTL
        }, 3000); // 3 ثواني
    </script>
</body>
</html>
