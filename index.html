<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ترولي ماركت | الرئيسية</title>
    <!-- Favicon is now dynamic via JS, but we keep a fallback -->
    <link rel="icon" href="images/favicon.jpg">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="top-bar">
        <div class="top-bar-text"><i class="fas fa-shopping-basket"></i> كل طلبات البيت لحد البيت</div>
        <div class="top-bar-text"><i class="fas fa-motorcycle"></i> أسرع دليفري وأفضل جودة</div>
    </div>

    <header class="navbar">
        <div class="logo">
            <h2>ترولي ماركت</h2>
            <span>TROLLEY MARKET</span>
        </div>
        <div class="nav-links">
            
        <a href="index.html" class="active">الرئيسية</a>
        <a href="categories.html" class="">الأقسام</a>
        <a href="catalog.html" class="">مجلة العروض</a>
        <a href="about.html" class="">حول</a>
    
        </div>
        <div class="actions-container">
            <button class="theme-toggle-btn" id="theme-btn" onclick="toggleTheme()"><i class="fas fa-moon" id="theme-icon"></i></button>
            <button class="cart-btn" onclick="toggleCart()"><i class="fas fa-shopping-cart"></i> السلة <span id="cart-count">0</span></button>
        </div>
    </header>

    
    <!-- Top Static Banner before slider -->
    <section class="static-banner top-main-banner"><img id="top-banner-img" src="images/placeholder.png"></section>
    
    <a href="#" id="slider-link">
        <section class="banner-slider-container">
            <img id="slider-banner-img" src="images/placeholder.png">
            <div id="slider-cat-name" class="glass-badge"></div>
        </section>
    </a>
    
    <section class="split-banners">
        <div class="half-banner"><img id="split1-img" src="images/placeholder.png"></div>
        <div class="half-banner"><img id="split2-img" src="images/placeholder.png"></div>
    </section>
    
    <section class="static-banner"><img id="main-banner-img" src="images/placeholder.png"></section>
    
    <main class="products-section">
        <div id="loading" style="text-align:center; padding: 20px; font-size:1.5rem;"><i class="fas fa-spinner fa-spin"></i> جاري قراءة ملف الإكسيل...</div>
        <div id="home-sections"></div>
    </main>


    <div class="mobile-bottom-nav">
        
        <a href="index.html" class="active"><i class="fas fa-home"></i>الرئيسية</a>
        <a href="categories.html" class=""><i class="fas fa-th-large"></i>الأقسام</a>
        <a href="catalog.html" class=""><i class="fas fa-book-open"></i>المجلة</a>
        <a href="about.html" class=""><i class="fas fa-info-circle"></i>حول</a>
    
    </div>

    <div class="toast-msg" id="toast-msg">تمت الإضافة للسلة بنجاح</div>
    
    <div class="cart-sidebar" id="cart-sidebar">
        <div class="cart-header"><h3>سلة المشتريات</h3><button class="close-cart" onclick="toggleCart()">&times;</button></div>
        <div class="cart-items" id="cart-items"></div>
        <div class="cart-footer">
            <div style="font-size:1.2rem;font-weight:bold;margin-bottom:15px;text-align:center;">الإجمالي: <span id="total-price">0</span> جنيه</div>
            <a href="#" target="_blank" class="checkout-btn" id="checkout-btn"><i class="fab fa-whatsapp"></i> إرسال الطلب واتساب</a>
            <button class="clear-cart-btn" onclick="clearCart()">إزالة كل الطلبات</button>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
