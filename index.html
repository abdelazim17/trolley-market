<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ترولي ماركت | الرئيسية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="navbar">
        <div class="logo">
            <h2>ترولي ماركت</h2>
            <span>TROLLEY MARKET</span>
        </div>
        <div class="nav-links">
            <a href="index.html" class="active">الرئيسية</a>
            <a href="categories.html">الأقسام</a>
            <a href="catalog.html">مجلة العروض</a>
            <a href="about.html">حول</a>
        </div>
        <div class="actions-container">
            <button class="theme-toggle-btn" id="theme-btn" onclick="toggleTheme()" title="تغيير الوضع">
                <i class="fas fa-moon" id="theme-icon"></i>
            </button>
            <button class="cart-btn" onclick="toggleCart()">
                <i class="fas fa-shopping-cart"></i> السلة <span id="cart-count">0</span>
            </button>
        </div>
    </header>

    <section class="welcome-banner">
        <div class="title">
            <h2>كل طلبات</h2>
            <h2><span class="highlight">البيت لحد البيت</span></h2>
        </div>
        <div class="subtitle">
            <p>من على الرف لحد باب بيتك في أسرع وقت!</p>
        </div>
    </section>

    <!-- Slider (قابل للنقر) -->
    <a href="#" id="slider-link">
        <section class="banner-slider-container">
            <img id="slider-banner-img" src="images/placeholder.png" alt="سلايدر القسم">
            <div class="slider-caption" id="slider-banner-title">جاري التحميل...</div>
        </section>
    </a>

    <!-- Split Banners -->
    <section class="split-banners">
        <div class="half-banner"><img id="split1-img" src="images/placeholder.png" alt="بانر يمين"></div>
        <div class="half-banner"><img id="split2-img" src="images/placeholder.png" alt="بانر يسار"></div>
    </section>

    <section class="static-banner">
        <img id="main-banner-img" src="images/placeholder.png" alt="بانر رئيسي">
    </section>
    
    <main class="products-section">
        <div id="loading" style="text-align:center; padding: 20px; font-weight:bold; font-size:1.5rem; color:var(--primary);">
            <i class="fas fa-spinner fa-spin"></i> جاري قراءة ملف الإكسيل...
        </div>
        <div id="home-sections"></div>
    </main>

    <!-- Cart & Toast -->
    <div class="toast-msg" id="toast-msg">تمت الإضافة للسلة بنجاح</div>
    
    <div class="cart-sidebar" id="cart-sidebar">
        <div class="cart-header">
            <h3>سلة المشتريات</h3>
            <button class="close-cart" onclick="toggleCart()">&times;</button>
        </div>
        <div class="cart-items" id="cart-items"></div>
        <div class="cart-footer">
            <div class="cart-total">الإجمالي: <span id="total-price">0</span> جنيه</div>
            <a href="#" target="_blank" class="checkout-btn" id="checkout-btn">
                <i class="fab fa-whatsapp"></i> إرسال الطلب عبر واتساب
            </a>
            <button class="clear-cart-btn" onclick="clearCart()">إزالة كل الطلبات</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
