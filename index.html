<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ترولي ماركت | الرئيسية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="navbar">
        <div class="logo">
            <h2>ترولي ماركت</h2>
            <span>TROLLEY MARKET</span>
        </div>
        <div class="nav-links">
            <a href="index.html" class="active">الرئيسية</a>
            <a href="offers.html">عروض اليوم</a>
            <a href="about.html">حول الموقع</a>
        </div>
        <div class="header-controls">
            <button class="cart-btn" onclick="toggleCart()">
                <i class="fas fa-shopping-cart"></i> السلة <span id="cart-count">0</span>
            </button>
        </div>
    </header>

    <!-- البانر الترحيبي -->
    <section class="welcome-banner">
        <h2>كل طلبات البيت لحد البيت</h2>
        <p>ترولي ماركت هو شريكك المثالي لتوفير كل احتياجات بيتك طازجة وبأفضل الأسعار. من على الرف لحد باب بيتك في أسرع وقت!</p>
    </section>

    <!-- المستطيل المقسوم نصين -->
    <section class="split-banners">
        <div class="half-banner">
            <img src="images/split1.jpg" alt="بانر يمين" onerror="this.outerHTML='<span>ضع صورة split1.jpg</span>'">
        </div>
        <div class="half-banner">
            <img src="images/split2.jpg" alt="بانر يسار" onerror="this.outerHTML='<span>ضع صورة split2.jpg</span>'">
        </div>
    </section>

    <!-- السلايدر/البانر الكبير الثابت -->
    <section class="static-banner">
        <img src="images/static_banner.jpg" alt="بانر رئيسي ثابت" onerror="this.outerHTML='<span>ضع صورة static_banner.jpg</span>'">
    </section>

    <!-- فلتر الأقسام -->
    <section class="categories-wrapper">
        <div class="categories" id="categories-text-container">
            <button class="cat-btn active" data-category="الكل">الكل</button>
            <!-- ستضاف الأقسام هنا برمجياً -->
        </div>
    </section>

    <main class="products-section">
        <div id="loading" style="text-align:center; padding: 20px; font-weight:bold;">جاري تحميل المنتجات من الإكسيل...</div>
        
        <div id="home-sections">
            <!-- سيتم عرض الأقسام بمنتجاتها هنا -->
        </div>
    </main>

    <!-- الشريط الجانبي للسلة (Sidebar) -->
    <div class="cart-sidebar" id="cart-sidebar">
        <div class="cart-header">
            <h3>سلة المشتريات</h3>
            <button class="close-cart" onclick="toggleCart()">&times;</button>
        </div>
        <div class="cart-items" id="cart-items"></div>
        <div class="cart-footer">
            <div class="cart-total">الإجمالي: <span id="total-price">0</span> جنيه</div>
            <a href="#" target="_blank" class="checkout-btn" id="checkout-btn">
                <i class="fab fa-whatsapp"></i> إرسال الطلب
            </a>
            <button class="clear-cart-btn" onclick="clearCart()">إفراغ السلة</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
