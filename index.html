<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ترولي ماركت | الرئيسية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="navbar">
        <div class="logo">
            <h2>ترولي ماركت</h2>
            <span>TROLLEY MARKET</span>
        </div>
        <div class="nav-links">
            <a href="index.html" class="active">الرئيسية</a>
            <a href="categories.html">الأقسام</a>
            <a href="about.html">حول الموقع</a>
        </div>
        <button class="cart-btn" onclick="toggleCart()">
            <i class="fas fa-shopping-cart"></i> السلة <span id="cart-count">0</span>
        </button>
    </header>

    <!-- البانر الترحيبي (الكحلي مع تقسيم السطور) -->
    <section class="welcome-banner">
        <div class="title">
            <h2>كل طلبات</h2>
            <h2><span class="highlight">البيت لحد البيت</span></h2>
        </div>
        <div class="subtitle">
            <p>من على الرف لحد باب بيتك في أسرع وقت!</p>
        </div>
    </section>

    <!-- سلايدر الأقسام (صور دائرية تعرض الأقسام التسعة) -->
    <section class="cat-slider-container">
        <div class="cat-slider" id="cat-visual-slider">
            <!-- سيتم حقن الأقسام هنا برمجياً -->
        </div>
    </section>

    <!-- 2 سلايدر مقسومين نصين -->
    <section class="split-banners">
        <div class="half-banner">
            <img src="images/split1.jpg" alt="بانر يمين">
        </div>
        <div class="half-banner">
            <img src="images/split2.jpg" alt="بانر يسار">
        </div>
    </section>

    <!-- سلايدر كبير ثابت -->
    <section class="static-banner">
        <img src="images/static_banner.jpg" alt="بانر رئيسي ثابت">
    </section>

    <div id="error-box" class="error-msg">
        حدثت مشكلة في قراءة ملف الإكسيل (products.xlsx). تأكد أن الملف موجود ومرفوع بشكل صحيح!
    </div>
    
    <main class="products-section">
        <div id="loading" style="text-align:center; padding: 20px; font-weight:bold; font-size:1.5rem; color:var(--primary);">
            <i class="fas fa-spinner fa-spin"></i> جاري تحميل العروض...
        </div>
        
        <div id="home-sections">
            <!-- عروض اليوم -->
        </div>
    </main>

    <!-- الشريط الجانبي للسلة -->
    <div class="cart-sidebar" id="cart-sidebar">
        <div class="cart-header">
            <h3>سلة المشتريات</h3>
            <button class="close-cart" onclick="toggleCart()">&times;</button>
        </div>
        <div class="cart-items" id="cart-items"></div>
        <div class="cart-footer">
            <div class="cart-total">الإجمالي: <span id="total-price">0</span> جنيه</div>
            <a href="#" target="_blank" class="checkout-btn" id="checkout-btn">
                <i class="fab fa-whatsapp"></i> إرسال الطلب عبر واتساب
            </a>
            <button class="clear-cart-btn" onclick="clearCart()">إزالة كل الطلبات</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
