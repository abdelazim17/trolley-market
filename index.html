<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ترولي ماركت | الرئيسية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="navbar">
        <div class="logo">
            <h2>ترولي ماركت</h2>
            <span>TROLLEY MARKET</span>
        </div>
        <div class="nav-links">
            <a href="index.html" class="active">الرئيسية</a>
        </div>
        <button class="cart-btn" onclick="alert('السلة تحت التطوير للتأكد من الأساسيات أولاً')">
            <i class="fas fa-shopping-cart"></i> السلة
        </button>
    </header>

    <!-- البانر الترحيبي (تم تعديل النص حسب طلبك) -->
    <section class="welcome-banner">
        <h2>كل طلبات البيت لحد البيت</h2>
        <p>من على الرف لحد باب بيتك في أسرع وقت!</p>
    </section>

    <!-- 2 سلايدر مقسومين نصين (تم تجهيز صور لهم) -->
    <section class="split-banners">
        <div class="half-banner">
            <img src="images/split1.jpg" alt="بانر يمين">
        </div>
        <div class="half-banner">
            <img src="images/split2.jpg" alt="بانر يسار">
        </div>
    </section>

    <!-- سلايدر كبير ثابت -->
    <section class="static-banner">
        <img src="images/static_banner.jpg" alt="بانر رئيسي ثابت">
    </section>

    <!-- فلتر الأقسام -->
    <section class="categories-wrapper">
        <div class="categories" id="categories-text-container">
            <button class="cat-btn active" data-category="الكل">الكل</button>
            <!-- سيتم إضافة الأقسام هنا -->
        </div>
    </section>

    <div id="error-box" class="error-msg">
        حدثت مشكلة في قراءة ملف الإكسيل (products.xlsx). تأكد أن الملف موجود ومرفوع بشكل صحيح!
    </div>
    
    <main class="products-section">
        <div id="loading" style="text-align:center; padding: 20px; font-weight:bold; font-size:1.5rem; color:var(--primary);">
            <i class="fas fa-spinner fa-spin"></i> جاري تحميل المنتجات...
        </div>
        
        <div id="home-sections">
            <!-- سيتم عرض المنتجات هنا -->
        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
