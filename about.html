<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ترولي ماركت | حول</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="navbar">
        <div class="logo">
            <h2>ترولي ماركت</h2>
        </div>
        <div class="nav-links">
            <a href="index.html">الرئيسية</a>
            <a href="categories.html">الأقسام</a>
            <a href="catalog.html">مجلة العروض</a>
            <a href="about.html" class="active">حول</a>
        </div>
        <div class="actions-container">
            <button class="theme-toggle-btn" id="theme-btn" onclick="toggleTheme()" title="تغيير الوضع">
                <i class="fas fa-moon" id="theme-icon"></i>
            </button>
        </div>
    </header>

    <div style="padding: 40px 5%; text-align: center; min-height: 70vh;">
        <h1 style="margin-bottom: 20px;">ترولي ماركت</h1>
        <p style="font-size: 1.2rem; margin-bottom: 25px; font-weight: bold; color: var(--primary);">
            كل طلبات البيت لحد البيت
        </p>
        
        <div style="background: var(--card-bg); padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); max-width: 450px; margin: 0 auto; border: 1px solid var(--border-color);">
            <h3 style="margin-bottom: 15px; color: var(--text-color);">امسح الـ QR Code لزيارة الموقع</h3>
            <div style="margin: 20px 0; display: inline-block; padding: 10px; background: white; border-radius: 10px; border: 1px solid #ddd;">
                <img src="images/qr_code.png" alt="QR Code" style="width: 180px; height: 180px; display: block;">
            </div>
            
            <div style="margin-top: 20px; display:flex; gap:10px;">
                <input type="text" id="site-url" value="https://abdelazim17.github.io/trolley-market" readonly style="flex:1; padding: 10px; border: 1px solid var(--border-color); border-radius: 5px; text-align: left; direction: ltr; background:var(--bg-color); color:var(--text-color);">
                <button onclick="copyLink()" style="padding: 10px 15px; background: var(--primary); color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold;">نسخ الرابط</button>
            </div>
        </div>
    </div>

    <!-- شريط التنقل السفلي للموبايل -->
    <nav class="mobile-bottom-nav">
        <a href="index.html"><i class="fas fa-home"></i>الرئيسية</a>
        <a href="categories.html"><i class="fas fa-th-large"></i>الأقسام</a>
        <a href="catalog.html"><i class="fas fa-book-open"></i>العروض</a>
        <a href="about.html" class="active"><i class="fas fa-info-circle"></i>حول</a>
    </nav>

    <script src="app.js"></script>
    <script>
        function copyLink() {
            const copyText = document.getElementById("site-url");
            copyText.select();
            document.execCommand("copy");
            alert("تم نسخ رابط الموقع بنجاح!");
        }
    </script>
</body>
</html>
