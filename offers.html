<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ترولي ماركت | عروض اليوم</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="navbar">
        <div class="logo">
            <h2>ترولي ماركت</h2>
        </div>
        <div class="nav-links">
            <a href="index.html">الرئيسية</a>
            <a href="offers.html" class="active">عروض اليوم</a>
            <a href="about.html">حول الموقع</a>
        </div>
        <div class="header-controls">
            <button class="cart-btn" onclick="toggleCart()">
                <i class="fas fa-shopping-cart"></i> السلة <span id="cart-count">0</span>
            </button>
        </div>
    </header>

    <div class="page-container">
        <h1>عروض اليوم الحصرية</h1>
        <!-- يمكنك وضع صورة بانر عروض هنا عبر كانفا -->
        <img src="images/offers_banner.jpg" alt="بانر العروض" style="width:100%; max-height:300px; border-radius:15px; margin-bottom: 20px; object-fit:cover;" onerror="this.style.display='none'">
        
        <div id="loading" style="text-align:center;">جاري تحميل العروض...</div>
        <div class="products-grid" id="offers-grid"></div>
    </div>

    <!-- السلة الجانبية -->
    <div class="cart-sidebar" id="cart-sidebar">
        <div class="cart-header">
            <h3>سلة المشتريات</h3>
            <button class="close-cart" onclick="toggleCart()">&times;</button>
        </div>
        <div class="cart-items" id="cart-items"></div>
        <div class="cart-footer">
            <div class="cart-total">الإجمالي: <span id="total-price">0</span> جنيه</div>
            <a href="#" target="_blank" class="checkout-btn" id="checkout-btn">
                <i class="fab fa-whatsapp"></i> إرسال الطلب
            </a>
            <button class="clear-cart-btn" onclick="clearCart()">إفراغ السلة</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
