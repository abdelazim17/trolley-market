<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ترولي ماركت | الأقسام</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="navbar">
        <div class="logo">
            <h2>ترولي ماركت</h2>
        </div>
        <div class="nav-links">
            <a href="index.html">الرئيسية</a>
            <a href="categories.html" class="active">الأقسام</a>
            <a href="about.html">حول الموقع</a>
        </div>
        <button class="cart-btn" onclick="toggleCart()">
            <i class="fas fa-shopping-cart"></i> السلة <span id="cart-count">0</span>
        </button>
    </header>

    <div class="page-container" style="padding: 20px 5%;">
        <h1 style="color: var(--dark); margin-bottom: 20px; font-size: 2rem;">جميع الأقسام</h1>
        
        <div id="loading" style="text-align:center; font-weight:bold;">جاري تحميل الأقسام...</div>
        <div id="categories-sections">
            <!-- سيتم عرض الأقسام هنا -->
        </div>
    </div>

    <!-- الشريط الجانبي للسلة -->
    <div class="cart-sidebar" id="cart-sidebar">
        <div class="cart-header">
            <h3>سلة المشتريات</h3>
            <button class="close-cart" onclick="toggleCart()">&times;</button>
        </div>
        <div class="cart-items" id="cart-items"></div>
        <div class="cart-footer">
            <div class="cart-total">الإجمالي: <span id="total-price">0</span> جنيه</div>
            <a href="#" target="_blank" class="checkout-btn" id="checkout-btn">
                <i class="fab fa-whatsapp"></i> إرسال الطلب عبر واتساب
            </a>
            <button class="clear-cart-btn" onclick="clearCart()">إزالة كل الطلبات</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
