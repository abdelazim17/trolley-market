<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ترولي ماركت | مجلة العروض</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="navbar">
        <div class="logo">
            <h2>ترولي ماركت</h2>
            <span>TROLLEY MARKET</span>
        </div>
        
        <div class="nav-links">
            <a href="index.html">الرئيسية</a>
            <a href="categories.html">الأقسام</a>
            <a href="catalog.html" class="active">مجلة العروض</a>
            <a href="about.html">حول الموقع</a>
        </div>
    
        <div class="actions-container">
            <button class="theme-toggle-btn" onclick="toggleTheme()"><i class="fas fa-moon" id="theme-icon"></i></button>
            <button class="cart-btn" onclick="toggleCart()"><i class="fas fa-shopping-cart"></i> السلة <span id="cart-count">0</span></button>
        </div>
    </header>

    <div class="catalog-container">
        <h1 style="margin-bottom: 10px; font-size: 2.2rem;">📖 مجلة العروض</h1>
        
        <div class="catalog-page">
            <h2 style="margin-bottom: 15px; color: var(--primary);">الصفحة الأولى</h2>
            <img src="images/offer_page_1.jpg" alt="صفحة العروض 1">
        </div>
        <div class="catalog-page">
            <h2 style="margin-bottom: 15px; color: var(--primary);">الصفحة الثانية</h2>
            <img src="images/offer_page_2.jpg" alt="صفحة العروض 2">
        </div>
    </div>

    <!-- البار السفلي للموبايل -->
    <nav class="bottom-nav">
        <a href="index.html"><i class="fas fa-home"></i><span>الرئيسية</span></a>
        <a href="categories.html"><i class="fas fa-th-large"></i><span>الأقسام</span></a>
        <a href="catalog.html" class="active"><i class="fas fa-book-open"></i><span>المجلة</span></a>
        <a href="about.html"><i class="fas fa-info-circle"></i><span>حول</span></a>
    </nav>
    
    <script src="app.js"></script>
</body>
</html>
